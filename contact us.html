<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Pro Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
      color: #333;
    }
    .contact-container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #0077cc;
    }
    form {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    form input, form textarea, form select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
    }
    form button {
      background: #0077cc;
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      transition: 0.3s;
    }
    form button:hover {
      background: #005fa3;
    }
    .info-box {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .info-box .item {
      display: flex;
      align-items: center;
      margin: 15px 0;
    }
    .info-box .item i {
      font-size: 1.5rem;
      margin-right: 15px;
      color: #0077cc;
    }
    @media(max-width: 768px) {
      .contact-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="contact-container">

    <div>
      <h2>Send Us a Message</h2>
      <form id="contactForm">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <input type="tel" placeholder="Your Phone">
        <select required>
          <option value="">Select Subject</option>
          <option value="support">Support</option>
          <option value="sales">Sales</option>
          <option value="feedback">Feedback</option>
        </select>
        <textarea rows="5" placeholder="Your Message" required></textarea>
        <input type="file" accept=".pdf,.doc,.jpg,.png">
        <button type="submit">Submit</button>
        <p id="formMessage" style="margin-top:10px;"></p>
      </form>
    </div>

 
    <div>
      <h2>Contact Information</h2>
      <div class="info-box">
        <div class="item"><i class="fas fa-map-marker-alt"></i> 237 Mayor Street, Buea, Cameroon</div>
        <div class="item"><i class="fas fa-phone"></i> +237 670 093 629</div>
        <div class="item"><i class="fas fa-envelope"></i> ngohlovert77@gmail.com </div>
        <div class="item"><i class="fab fa-whatsapp"></i> +237 677 239 675</div>
        <div class="item"><i class="far fa-clock"></i> Mon - Fri: 9AM - 6PM</div>
        <div class="item"><i class="fab fa-facebook"></i> <a href="https://www.facebook.com/NGOH LOVERT">Facebook</a></div>
        <div class="item"><i class="fab fa-twitter"></i> <a href="#">Twitter</a></div>
        <div class="item"><i class="fab fa-whatsapp"></i> <a href="https://wa.me/123670093629" target="_blank"">Whatsapp</a></div>
      </div>
      <button class="btn"><a href="homepage.html">Back To Home</a></button>
    </div>
  </div>

  <script>
    const form = document.getElementById("contactForm");
    const msg = document.getElementById("formMessage");

    form.addEventListener("submit", function(e){
      e.preventDefault();
      msg.textContent = "✅ Your message has been sent!";
      msg.style.color = "green";
      form.reset();
    });
  </script>
</body>
</html>
