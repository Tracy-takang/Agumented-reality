<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - Frequently Asked Questions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #041870 0%, #f9f7fa 100%);
        min-height: 100vh;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    .header {
        text-align: center;
        margin-bottom: 40px;
        color: white;
    }

    .header h1 {
        font-size: 3em;
        margin-bottom: 10px;
        font-weight: 300;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .header p {
        font-size: 1.2em;
        opacity: 0.9;
    }

    .search-section {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 40px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .search-container {
        position: relative;
        max-width: 600px;
        margin: 0 auto 20px;
    }

    .search-input {
        width: 100%;
        padding: 15px 20px 15px 50px;
        font-size: 16px;
        border: none;
        border-radius: 50px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        transition: all 0.3s ease;
    }

    .search-input:focus {
        outline: none;
        background: white;
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        transform: translateY(-2px);
    }

    .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
    }

    .category-filters {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .filter-btn {
        padding: 8px 20px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 14px;
    }

    .filter-btn:hover, .filter-btn.active {
        background: rgba(255, 255, 255, 0.9);
        color: #333;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .faq-container {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .faq-item {
        border-bottom: 1px solid #eee;
        transition: all 0.3s ease;
    }

    .faq-item:last-child {
        border-bottom: none;
    }

    .faq-item:hover {
        background: #f8f9ff;
    }

    .faq-question {
        width: 100%;
        padding: 25px 30px;
        background: none;
        border: none;
        text-align: left;
        cursor: pointer;
        font-size: 18px;
        font-weight: 600;
        color: #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.3s ease;
    }

    .faq-question:hover {
        color: #667eea;
    }

    .faq-icon {
        font-size: 20px;
        transition: transform 0.3s ease;
        color: #667eea;
    }

    .faq-item.active .faq-icon {
        transform: rotate(45deg);
    }

    .faq-answer {
        max-height: 0;
        overflow: hidden;
        transition: all 0.4s ease;
        background: #f8f9ff;
    }

    .faq-item.active .faq-answer {
        max-height: 300px;
        padding: 0 30px 25px;
    }

    .faq-answer p {
        color: #666;
        line-height: 1.8;
        margin-top: 15px;
    }

    .category-tag {
        display: inline-block;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        padding: 4px 12px;
        border-radius: 15px;font-size: 12px;
        font-weight: 500;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .no-results {
        text-align: center;
        padding: 60px 30px;
        color: #666;
    }

    .no-results h3 {
        margin-bottom: 10px;
        color: #333;
    }

    .stats {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-bottom: 30px;
        color: white;
    }

    .stat {
        text-align: center;
    }

    .stat-number {
        font-size: 2em;
        font-weight: bold;
        display: block;
    }

    .stat-label {
        font-size: 0.9em;
        opacity: 0.8;
    }

    @media (max-width: 768px) {
        .container {
            padding: 15px;
        }

        .header h1 {
            font-size: 2.2em;
        }

        .search-section {
            padding: 20px;
        }

        .faq-question {
            padding: 20px;
            font-size: 16px;
        }

        .faq-item.active .faq-answer {
            padding: 0 20px 20px;
        }

        .stats {
            gap: 20px;
        }

        .category-filters {
            justify-content: center;
        }
    }

    .fade-in {
        animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn {
    display: inline-block;
    background-color: rgb(247, 247, 248);
    color: white;
    padding: 10px 30px;
    margin-top: 15px;
    text-decoration: none;
    border-radius: 15px;
    font-weight: bold;
  }

</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Frequently Asked Questions</h1>
            <p>Find answers to common questions about our services</p>
        </div>
    <div class="search-section">
        <div class="stats">
            <div class="stat">
                <span class="stat-number" id="totalQuestions">12</span>
                <span class="stat-label">Total Questions</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="visibleQuestions">12</span>
                <span class="stat-label">Showing</span>
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search for answers...">
            <div class="search-icon">🔍</div>
        </div>

        <div class="category-filters">
            <button class="filter-btn active" data-category="all">All Categories</button>
            <button class="filter-btn" data-category="general">General</button>
            <button class="filter-btn" data-category="billing">Billing</button>
            <button class="filter-btn" data-category="technical">Technical</button>
            <button class="filter-btn" data-category="account">Account</button>
            <button class="btn"><a href="homepage.html">Home</a></button>
        </div>
    </div>

    <div class="faq-container">
        <div class="faq-list" id="faqList">
        </div>
        <div class="no-results" id="noResults" style="display: none;">
            <h3>No results found</h3>
            <p>Try adjusting your search terms or browse all categories</p>
        </div>
    </div>
</div>

<script>
    const faqData = [
        {
            id: 1,
            category: 'general',
            question: 'What services do you offer?',
            answer: 'We offer a comprehensive range of digital services including web development, mobile app development, digital marketing, SEO optimization, and cloud solutions. Our team specializes in creating custom solutions tailored to your business needs.'
        },
        {
            id: 2,
            category: 'billing',
            question: 'How does your pricing work?',
            answer: 'Our pricing is project-based and depends on the scope, complexity, and timeline of your requirements. We offer transparent pricing with no hidden fees. Contact us for a detailed quote based on your specific needs.'
        },
        {
            id: 3,
            category: 'technical',
            question: 'What technologies do you use?',
answer: 'We work with modern technologies including React, Vue.js, Node.js, Python, AWS, Docker, and various databases. We choose the best technology stack based on your project requirements and long-term goals.'
        },
        {
            id: 4,
            category: 'general',
            question: 'How long does a typical project take?',
            answer: 'Project timelines vary depending on complexity and scope. Simple websites typically take 2-4 weeks, while complex web applications can take 3-6 months. We provide detailed timelines during the planning phase.'
        },
        {
            id: 5,
            category: 'account',
            question: 'How do I get started with your services?',
            answer: 'Getting started is easy! Contact us through our website or email, and we\'ll schedule a consultation to discuss your needs. We\'ll then provide a detailed proposal and timeline for your project.'
        },
        {
            id: 6,
            category: 'technical',
            question: 'Do you provide ongoing support and maintenance?',
            answer: 'Yes, we offer comprehensive support and maintenance packages. This includes regular updates, security patches, performance monitoring, and technical support to ensure your application runs smoothly.'
        },
        {
            id: 7,
            category: 'billing',
            question: 'What payment methods do you accept?',
            answer: 'We accept various payment methods including bank transfers, credit cards, and PayPal. For larger projects, we offer flexible payment schedules with milestone-based payments.'
        },
        {
            id: 8,
            category: 'general',
            question: 'Do you work with international clients?',
            answer: 'Absolutely! We work with clients worldwide and have experience managing projects across different time zones. We use modern collaboration tools to ensure smooth communication regardless of location.'
        },
        {
            id: 9,
            category: 'technical',
            question: 'Can you help migrate my existing website?',
            answer: 'Yes, we specialize in website migrations and can help transfer your existing site to a new platform, improve performance, and enhance functionality while preserving your data and SEO rankings.'
        },
        {
            id: 10,
            category: 'account',
            question: 'Do you provide training for using the systems you build?',
            answer: 'Yes, we provide comprehensive training sessions for your team to effectively use and manage the systems we develop. This includes documentation, video tutorials, and hands-on training sessions.'
        },
        {
            id: 11,
            category: 'billing',
            question: 'Do you offer refunds?',
            answer: 'We stand behind our work and offer refunds in accordance with our terms of service. If you\'re not satisfied with our work, we\'ll work with you to resolve any issues or provide appropriate compensation.'
        },
        {
            id: 12,
            category: 'general',
            question: 'What makes your company different?',
            answer: 'We focus on building long-term partnerships with our clients, delivering high-quality solutions that drive real business results. Our team combines technical expertise with strategic thinking to create solutions that grow with your business.'
        }
    ];

  
    const searchInput = document.getElementById('searchInput');
    const faqList = document.getElementById('faqList');
    const noResults = document.getElementById('noResults');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const totalQuestions = document.getElementById('totalQuestions');
    const visibleQuestions = document.getElementById('visibleQuestions');

   
    let currentCategory = 'all';
    let searchTerm = '';

  
    function init() {
        renderFAQs(faqData);
        attachEventListeners();
    }
    function renderFAQs(faqs) {
        if (faqs.length === 0) {
            faqList.style.display = 'none';
            noResults.style.display = 'block';
            visibleQuestions.textContent = '0';
            return;
        }

        faqList.style.display = 'block';
        noResults.style.display = 'none';
        visibleQuestions.textContent = faqs.length;

        faqList.innerHTML = faqs.map(faq => `
            <div class="faq-item fade-in" data-id="${faq.id}">
                <div class="category-tag">${faq.category}</div>
                <button class="faq-question">
                    <span>${faq.question}</span>
                    <span class="faq-icon">+</span>
                </button>
                <div class="faq-answer">
                    <p>${faq.answer}</p>
                </div>
            </div>
        `).join('');

        attachFAQEventListeners();
    }

    
    function filterFAQs() {
        let filteredFAQs = faqData;

       
        if (currentCategory !== 'all') {
            filteredFAQs = filteredFAQs.filter(faq => faq.category === currentCategory);
        }

       
        if (searchTerm) {
            filteredFAQs = filteredFAQs.filter(faq => 
                faq.question.toLowerCase().includes(searchTerm.toLowerCase()) ||
                faq.answer.toLowerCase().includes(searchTerm.toLowerCase())
            );
        }

        renderFAQs(filteredFAQs);
    }

  
    function attachEventListeners() {
       
        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            filterFAQs();
        });

      
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                filterFAQs();
            });
        });
    }

    function attachFAQEventListeners() {
        const faqItems = document.querySelectorAll('.faq-item');
        
        faqItems.forEach(item => {
            const question = item.querySelector('.faq-question');
            question.addEventListener('click', () => {
                const isActive = item.classList.contains('active');
                
            
                faqItems.forEach(otherItem => {
                    otherItem.classList.remove('active');
                });
                
            
                if (!isActive) {
                    item.classList.add('active');
                }
            });
        });
    }

    init();
</script>

</body>
</html>
