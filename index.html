<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRY AM Website</title>
  <style>
    /* Full page gradient background: aqua to pink */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #00FFFF, #FFB6C1); /* aqua to pink */
      display: flex;
      flex-direction: column;
      color: #333;
    }

    /* Header buttons */
    header {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      padding: 15px 30px;
      position: absolute;
      top: 0;
      z-index: 2;
      gap: 15px;
    }

    header button {
      padding: 8px 16px;
      font-size: 14px;
      border: 2px solid #007BFF;
      border-radius: 6px;
      cursor: pointer;
      background: #ffffffaa; /* semi-transparent white */
      color: #007BFF;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    header button:hover {
      background: #ff99cc; /* light pink on hover */
      color: #fff;
      border-color: #ff66aa;
    }

    /* Main content wrapper */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-top: 70px;
      width: 100%;
    }

    .main-wrapper h1 {
      font-size: 48px;
      font-weight: 700;
      color: #004d4d;
      text-shadow: 2px 2px 5px rgba(255,255,255,0.7);
      margin-bottom: 50px;
    }

    /* Container for login/signup buttons */
    .container {
      width: 350px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.85); /* semi-transparent white */
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .container a {
      width: 100%;
      text-decoration: none;
    }

    .container button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(90deg, #00FFFF, #FFB6C1); /* button gradient */
      color: #fff;
      transition: 0.3s ease;
    }

    .container button:hover {
      background: linear-gradient(90deg, #00cccc, #ff99cc);
    }

    /* Responsive adjustments */
    @media (max-width: 400px) {
      .container {
        width: 90%;
        padding: 30px 20px;
      }

      .main-wrapper h1 {
        font-size: 36px;
      }

      header button {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Header buttons -->
  <header>
    <button onclick="window.history.back()">Back</button>
    <button><a href="homepage.html">Home Page</a></button>
    <button onclick="window.close()">Close</button>
  </header>

  <!-- Main content -->
  <div class="main-wrapper">
    <h1>Welcome to TRY AM Website</h1>

    <div class="container">
      <a href="http://localhost/TRY%20AM/login.php"><button>Login</button></a>
      <a href="http://localhost/TRY%20AM/insert_data.php"><button>Signup</button></a>
    </div>
  </div>

</body>
</html>
