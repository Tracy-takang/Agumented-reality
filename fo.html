<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
    <style>
      *{
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    box-sizing: border-box;
}
body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(45deg, pink,aqua);
}
form{
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 20px 30px;
    background-color: white;
    border-radius: 5px;
}
.formgroup{
    display: flex;
    flex-direction: column;
    gap: 5px;
}
input{
    padding: 12px 16px;
    font-size: 20px;
    border-radius: 5px;
    border: none;
    background-color: beige;
}
button{
    background-color: rgb(84, 84, 225);
    padding: 12px 16px;
    border-radius: 5px;
    border: none;
    color: white;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
}
button:hover{
   color: aliceblue;
   background-color: green;
}
    </style>
</head>
<body>
<form method="post" class="form">
    <h2>Confirm email and password</h2>
    Email: <input type="email" name="email" required><br>
    Password: <input type="password" name="password" required><br>
    <button type="submit" name="register_user">sigin</button>
</form>
</body>
</html>
